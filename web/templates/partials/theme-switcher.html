{{define "theme-switcher"}}
<label class="inline-flex items-center" x-data>
    <span class="sr-only">Theme</span>
    <select aria-label="Theme" x-model="$store.theme.preference" @change="$store.theme.set($event.target.value)"
        class="input px-2.5 text-sm text-slate-700 hover:bg-slate-50 dark:text-slate-200 dark:hover:bg-slate-800">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="system">System</option>
    </select>
</label>
{{end}}
