{{define "content"}}
<section><div class="mb-6"><p class="text-sm font-medium text-emerald-600 dark:text-emerald-400">Reporting</p><h1 class="mt-1 text-3xl font-bold tracking-tight text-slate-950 dark:text-white">Reports</h1><p class="mt-2 text-slate-600 dark:text-slate-400">Reports explicitly granted to your account.</p></div><div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">{{range .Data.Rows}}<a href="/reports/{{.ID}}" class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm hover:border-emerald-400 hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-900 dark:hover:border-emerald-700 dark:hover:bg-slate-800/40"><h2 class="font-semibold text-slate-950 dark:text-white">{{.Name}}</h2><p class="mt-2 text-sm text-slate-600 dark:text-slate-400">{{.Description}}</p><p class="mt-4 text-xs text-slate-500 dark:text-slate-400">{{.DatasourceName}}</p></a>{{else}}<p class="text-slate-500 dark:text-slate-400">No reports are currently available to you.</p>{{end}}</div></section>
{{end}}
