{{define "content"}}<section class="max-w-full"><p class="text-sm font-medium text-emerald-600 dark:text-emerald-400">Data Ingestion</p><h1 class="mt-1 text-3xl font-bold">Run All</h1><p class="mt-2 text-sm text-slate-600 dark:text-slate-400">Creates {{.Data.JobCount}} frozen children. Children activate sequentially; busy or disabled jobs are skipped, failures do not stop siblings.</p>{{if .Data.Errors.form}}<p role="alert" class="mt-4 text-sm text-red-600">{{.Data.Errors.form}}</p>{{end}}<form method="post" action="/runs/run-all" class="mt-6 space-y-4 rounded-xl border bg-white p-6 dark:border-slate-800 dark:bg-slate-900" data-confirm data-confirm-title="Run all sources?" data-confirm-message="Submit all {{.Data.JobCount}} ingestion jobs for this period?" data-confirm-label="Submit Run All"><div class="grid gap-4 sm:grid-cols-2"><label>From<input type="date" name="from" required value="{{.Data.From}}" class="mt-1 w-full rounded-lg border bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-900">{{with .Data.Errors.from}}<span role="alert" class="text-sm text-red-600">{{.}}</span>{{end}}</label><label>To<input type="date" name="to" required value="{{.Data.To}}" class="mt-1 w-full rounded-lg border bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-900">{{with .Data.Errors.to}}<span role="alert" class="text-sm text-red-600">{{.}}</span>{{end}}</label></div><button class="rounded-lg bg-emerald-500 px-4 py-2.5 font-semibold text-slate-950">Submit Run All</button></form></section>{{end}}
