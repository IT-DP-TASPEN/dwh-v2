{{define "content"}}
<section><div class="mb-6"><p class="text-sm font-medium text-emerald-600 dark:text-emerald-400">Data Ingestion</p><h1 class="page-title mt-1">Runs</h1></div>
<form method="get" action="/runs" hx-get="/runs" hx-target="#runs-table" hx-swap="outerHTML" hx-push-url="true" class="mb-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
<label class="text-sm">Job<select name="job" class="input mt-1 w-full"><option value="">All</option>{{range .Data.Jobs}}<option value="{{.Key}}" {{if eq $.Data.Filter.Job .Key}}selected{{end}}>{{.Name}}</option>{{end}}</select></label>
<label class="text-sm">Status<select name="status" class="input mt-1 w-full"><option value="">All</option>{{range .Data.Statuses}}<option {{if eq $.Data.Filter.Status .}}selected{{end}}>{{.}}</option>{{end}}</select></label>
<label class="text-sm">Kind<select name="kind" class="input mt-1 w-full"><option value="">All</option>{{range .Data.Kinds}}<option value="{{.Value}}" {{if eq $.Data.Filter.Kind .Value}}selected{{end}}>{{.Label}}</option>{{end}}</select></label>
<label class="text-sm">Trigger<select name="trigger" class="input mt-1 w-full"><option value="">All</option>{{range .Data.Triggers}}<option {{if eq $.Data.Filter.Trigger .}}selected{{end}}>{{.}}</option>{{end}}</select></label><button class="btn btn-primary self-end">Filter</button></form>
<p class="-mt-3 mb-5 text-xs text-slate-500">All Kind and Trigger groups scheduler activity by exact scheduled time. Select a Kind or Trigger to inspect individual runs.</p>
{{template "runs-table" .}}</section>
{{end}}
