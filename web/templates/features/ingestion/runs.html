{{define "content"}}
<section><div class="mb-6"><p class="text-sm font-medium text-emerald-600 dark:text-emerald-400">Data Ingestion</p><h1 class="mt-1 text-3xl font-bold">Runs</h1></div>
<form method="get" action="/runs" hx-get="/runs" hx-target="#runs-table" hx-swap="outerHTML" hx-push-url="true" class="mb-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
<label class="text-sm">Job<select name="job" class="mt-1 w-full rounded-lg border bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-900"><option value="">All</option>{{range .Data.Jobs}}<option value="{{.Key}}" {{if eq $.Data.Filter.Job .Key}}selected{{end}}>{{.Name}}</option>{{end}}</select></label>
<label class="text-sm">Status<select name="status" class="mt-1 w-full rounded-lg border bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-900"><option value="">All</option>{{range .Data.Statuses}}<option {{if eq $.Data.Filter.Status .}}selected{{end}}>{{.}}</option>{{end}}</select></label>
<label class="text-sm">Kind<select name="kind" class="mt-1 w-full rounded-lg border bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-900"><option value="">All</option>{{range .Data.Kinds}}<option value="{{.Value}}" {{if eq $.Data.Filter.Kind .Value}}selected{{end}}>{{.Label}}</option>{{end}}</select></label>
<label class="text-sm">Trigger<select name="trigger" class="mt-1 w-full rounded-lg border bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-900"><option value="">All</option>{{range .Data.Triggers}}<option {{if eq $.Data.Filter.Trigger .}}selected{{end}}>{{.}}</option>{{end}}</select></label><button class="self-end rounded-lg bg-emerald-500 px-4 py-1.5 font-semibold text-slate-950">Filter</button></form>
{{template "runs-table" .}}</section>
{{end}}
