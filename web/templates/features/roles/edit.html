{{/* Roles feature */}}{{define "content"}}
<section class="max-w-full"><a href="/roles" class="link text-sm">← Roles</a><h1 class="page-title mt-4">Edit Role</h1><form method="post" action="{{.Data.Action}}" class="card mt-6 space-y-5 p-6">{{with index .Data.Errors "form"}}<p role="alert" class="alert-error">{{.}}</p>{{end}}<div><label for="name" class="block text-sm font-medium">Name</label><input id="name" name="name" value="{{.Data.Name}}" required aria-describedby="name-error" class="input mt-2 w-full"><p id="name-error" class="mt-1 text-sm text-red-600">{{index .Data.Errors "name"}}</p></div><div><p class="text-sm font-medium">Slug</p><p class="mt-2 font-mono text-slate-600 dark:text-slate-300">{{.Data.Slug}}</p><p class="mt-1 text-xs text-slate-500">Role slugs are immutable.</p></div><div class="flex gap-3"><button class="btn btn-primary">Save Changes</button><a href="/roles" class="btn btn-ghost">Cancel</a></div></form></section>
{{end}}
