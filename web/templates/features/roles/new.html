{{/* Roles feature */}}{{define "content"}}
<section class="max-w-full"><a href="/roles" class="link text-sm">← Roles</a><h1 class="page-title mt-4">New Role</h1><form method="post" action="/roles" class="card mt-6 space-y-5 p-6"><div><label for="name" class="block text-sm font-medium">Name</label><input id="name" name="name" value="{{.Data.Name}}" required aria-describedby="name-error" class="input mt-2 w-full"><p id="name-error" class="mt-1 text-sm text-red-600">{{index .Data.Errors "name"}}</p></div><div><label for="slug" class="block text-sm font-medium">Slug</label><input id="slug" name="slug" value="{{.Data.Slug}}" required pattern="[a-z0-9]+([-_][a-z0-9]+)*" aria-describedby="slug-error" class="input mt-2 w-full font-mono"><p class="mt-1 text-xs text-slate-500">Lowercase letters, numbers, hyphens, or underscores. Immutable after creation.</p><p id="slug-error" class="mt-1 text-sm text-red-600">{{index .Data.Errors "slug"}}</p></div><div class="flex gap-3"><button class="btn btn-primary">Create Role</button><a href="/roles" class="btn btn-ghost">Cancel</a></div></form></section>
{{end}}
