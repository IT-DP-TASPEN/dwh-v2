{{define "content"}}
<section><div class="mb-6 flex items-end justify-between gap-4"><div><p class="text-sm font-medium text-emerald-600 dark:text-emerald-400">Data ingestion</p><h1 class="mt-1 text-3xl font-bold">Custom datasets</h1><p class="mt-2 text-slate-600 dark:text-slate-400">Publish retained CSV uploads as stable SQL views.</p></div>{{if .Data.CanManage}}<a href="/custom-datasets/new" class="rounded-lg bg-emerald-500 px-4 py-2.5 text-sm font-semibold text-slate-950">New dataset</a>{{end}}</div>
<div class="overflow-x-auto rounded-xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900"><table class="min-w-full divide-y divide-slate-200 text-left text-sm dark:divide-slate-800"><thead><tr><th class="px-4 py-3">Name</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Rows</th><th class="px-4 py-3">SQL view</th></tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-800">{{range .Data.Rows}}<tr><td class="px-4 py-3 font-medium"><a href="/custom-datasets/{{.ID}}" class="hover:text-emerald-600">{{.Name}}</a></td><td class="px-4 py-3">{{.Status}}</td><td class="px-4 py-3">{{.RowCount}}</td><td class="px-4 py-3 font-mono text-xs">custom_dataset_view_{{.ID}}</td></tr>{{else}}<tr><td colspan="4" class="px-4 py-12 text-center text-slate-500">No custom datasets.</td></tr>{{end}}</tbody></table></div></section>
{{end}}
