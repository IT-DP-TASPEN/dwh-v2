{{define "content"}}
<section class="max-w-full"><p class="text-sm font-medium text-emerald-600 dark:text-emerald-400">Custom datasets</p><h1 class="mt-1 text-3xl font-bold">{{if .Data.Dataset}}Import into {{.Data.Dataset.Name}}{{else}}Upload CSV{{end}}</h1><p class="mt-2 text-slate-600 dark:text-slate-400">UTF-8 CSV only. Maximum 150,000,000 bytes.</p>
{{if .Data.Error}}<p role="alert" class="mt-4 rounded-lg bg-red-50 p-3 text-sm text-red-700 dark:bg-red-950/40 dark:text-red-300">{{.Data.Error}}</p>{{end}}
<form class="mt-6 space-y-5 rounded-xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900" method="post" enctype="multipart/form-data" action="/custom-datasets/uploads{{if .Data.Dataset}}?dataset_id={{.Data.Dataset.ID}}&amp;mode={{.Data.Mode}}{{end}}">
<div><label for="file" class="block text-sm font-medium">CSV file</label><input id="file" name="file" type="file" accept=".csv,text/csv" required class="mt-2 block w-full rounded-lg border border-slate-300 p-3 dark:border-slate-700"></div>
<div class="flex gap-3"><button class="rounded-lg bg-emerald-500 px-4 py-2.5 text-sm font-semibold text-slate-950">Upload and preview</button><a class="rounded-lg px-4 py-2.5 text-sm" href="{{if .Data.Dataset}}/custom-datasets/{{.Data.Dataset.ID}}{{else}}/custom-datasets{{end}}">Cancel</a></div></form></section>
{{end}}
