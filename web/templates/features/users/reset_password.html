{{/* Users feature */}}{{define "content"}}
<section class="max-w-full">
    <a href="/users/{{.Data.User.ID}}" class="link text-sm">← {{.Data.User.Name}}</a>
    <h1 class="page-title mt-4">Reset Password</h1>
    <p class="mt-2 text-slate-600 dark:text-slate-400">All sessions for @{{.Data.User.Username}} will be revoked.</p>
    <form method="post" action="/users/{{.Data.User.ID}}/reset-password" class="card mt-6 space-y-5 p-6">
        <div><label for="password" class="block text-sm font-medium">New Password</label><input id="password" name="password" type="password" required autocomplete="new-password" aria-describedby="password-error" class="input mt-2 w-full"><p id="password-error" class="mt-1 text-sm text-red-600 dark:text-red-400">{{index .Data.Errors "password"}}</p></div>
        <div><label for="password-confirmation" class="block text-sm font-medium">Confirm Password</label><input id="password-confirmation" name="password_confirmation" type="password" required autocomplete="new-password" aria-describedby="password-confirmation-error" class="input mt-2 w-full"><p id="password-confirmation-error" class="mt-1 text-sm text-red-600 dark:text-red-400">{{index .Data.Errors "password_confirmation"}}</p></div>
        <button class="btn btn-danger">Reset Password</button>
    </form>
</section>
{{end}}
