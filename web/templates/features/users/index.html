{{/* Users feature */}}{{define "content"}}
<section>
    <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <p class="text-sm font-medium text-emerald-600 dark:text-emerald-400">Management</p>
            <h1 class="page-title mt-1">Users</h1>
            <p class="mt-2 text-slate-600 dark:text-slate-400">Manage identities, roles, account status, and passwords.</p>
        </div>
        {{if .Data.CanCreate}}<a href="/users/new" class="btn btn-primary">New User</a>{{end}}
    </div>

    <form method="get" action="/users" class="mb-4" hx-get="/users" hx-target="#users-table" hx-swap="outerHTML" hx-push-url="true" hx-trigger="input changed delay:300ms, search">
        <label for="user-search" class="sr-only">Search users</label>
        <input id="user-search" name="q" type="search" value="{{.Data.Query}}" placeholder="Search name or username" autocomplete="off" class="input w-full max-w-md text-sm">
    </form>
    {{template "users-table" .}}
</section>
{{end}}
