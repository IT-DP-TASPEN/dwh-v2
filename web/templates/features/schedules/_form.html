{{define "schedule-form"}}
{{with .Data.Errors.form}}<p role="alert" class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-700 dark:bg-red-950 dark:text-red-200">{{.}}</p>{{end}}
<div class="space-y-4"><label class="block text-sm">Name<input name="name" required maxlength="128" value="{{.Data.Name}}" class="mt-1 w-full rounded-lg border bg-white px-3 py-2.5 dark:border-slate-700 dark:bg-slate-900"></label><label class="block text-sm">Job<select name="job_key" required class="mt-1 w-full rounded-lg border bg-white px-3 py-2.5 dark:border-slate-700 dark:bg-slate-900"><option value="">Choose a job</option>{{range .Data.Jobs}}<option value="{{.Key}}" {{if eq $.Data.JobKey .Key}}selected{{end}}>{{.Name}}</option>{{end}}</select></label><label class="block text-sm">Cron (strict five fields)<input name="cron_expression" required maxlength="128" value="{{.Data.CronExpression}}" placeholder="0 1 * * *" class="mt-1 w-full rounded-lg border bg-white px-3 py-2.5 font-mono dark:border-slate-700 dark:bg-slate-900"></label><label class="block text-sm">IANA timezone<input name="timezone" required maxlength="64" value="{{.Data.Timezone}}" class="mt-1 w-full rounded-lg border bg-white px-3 py-2.5 dark:border-slate-700 dark:bg-slate-900"></label></div>
{{end}}
