{{define "schedule-form"}}
{{with .Data.Errors.form}}<p role="alert" class="alert-error mb-4">{{.}}</p>{{end}}
<div class="space-y-4"><label class="block text-sm">Name<input name="name" required maxlength="128" value="{{.Data.Name}}" class="input mt-1 w-full"></label><label class="block text-sm">Job<select name="job_key" required class="input mt-1 w-full"><option value="">Choose a job</option>{{range .Data.Jobs}}<option value="{{.Key}}" {{if eq $.Data.JobKey .Key}}selected{{end}}>{{.Name}}</option>{{end}}</select></label><label class="block text-sm">Cron (strict five fields)<input name="cron_expression" required maxlength="128" value="{{.Data.CronExpression}}" placeholder="0 1 * * *" class="input mt-1 w-full font-mono"></label><label class="block text-sm">IANA timezone<input name="timezone" required maxlength="64" value="{{.Data.Timezone}}" class="input mt-1 w-full"></label></div>
{{end}}
