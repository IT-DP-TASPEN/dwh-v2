{{define "content"}}<section class="max-w-full"><a href="/schedules/{{.Data.ID}}" class="text-sm font-medium text-emerald-700 hover:underline dark:text-emerald-400">← Schedule</a><h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-950 dark:text-white">Edit schedule</h1><p class="mt-2 text-sm text-slate-600 dark:text-slate-400">Semantic changes are blocked while backlog is unresolved. Use Disable → Edit → Enable to intentionally discard backlog.</p><form method="post" action="/schedules/{{.Data.ID}}" class="mt-6 rounded-xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900"><input type="hidden" name="expected_revision" value="{{.Data.ExpectedRevision}}">{{template "schedule-form" .}}<button class="mt-5 rounded-lg bg-emerald-500 px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-emerald-400">Save schedule</button></form></section>{{end}}
