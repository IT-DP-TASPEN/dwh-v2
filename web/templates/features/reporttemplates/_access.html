{{define "access-list"}}<div id="report-access-list">
  <form method="get" action="/report-templates/{{.ReportID}}/access" hx-get="/report-templates/{{.ReportID}}/access" hx-target="#report-access-list" hx-swap="outerHTML" hx-trigger="input changed delay:300ms, search" class="mb-3"><label class="sr-only" for="access-search">Search users</label><input id="access-search" type="search" name="q" value="{{.Query}}" placeholder="Search active users" class="input w-full"></form>
  <div class="overflow-hidden rounded-lg border border-slate-200 dark:border-slate-800">{{range .Rows}}<div class="flex items-center justify-between gap-3 border-t border-slate-200 px-3 py-3 first:border-t-0 dark:border-slate-800"><div class="min-w-0"><p class="truncate font-medium">{{.Name}}</p><p class="truncate text-xs text-slate-500 dark:text-slate-400">@{{.Username}}</p></div><form method="post" action="/report-templates/{{$.ReportID}}/access/{{.ID}}" hx-post="/report-templates/{{$.ReportID}}/access/{{.ID}}?q={{$.Query}}&page={{$.Pagination.Page}}" hx-target="#report-access-list" hx-swap="outerHTML"><input type="hidden" name="grant" value="{{if .Granted}}false{{else}}true{{end}}"><button class="btn btn-sm py-1.5 {{if .Granted}}btn-danger-outline{{else}}btn-secondary{{end}}">{{if .Granted}}Revoke{{else}}Grant{{end}}</button></form></div>{{else}}<p class="p-4 text-sm text-slate-500 dark:text-slate-400">No matching users.</p>{{end}}</div>
  <div class="mt-3 flex gap-2">{{if .Pagination.Previous}}<a hx-get="/report-templates/{{.ReportID}}/access?q={{.Query}}&page={{.Pagination.Previous}}" hx-target="#report-access-list" hx-swap="outerHTML" class="btn btn-secondary btn-sm">Previous</a>{{end}}{{if .Pagination.Next}}<a hx-get="/report-templates/{{.ReportID}}/access?q={{.Query}}&page={{.Pagination.Next}}" hx-target="#report-access-list" hx-swap="outerHTML" class="btn btn-secondary btn-sm">Next</a>{{end}}</div>
</div>{{end}}
