{{define "access-list"}}<div id="report-access-list">
  <form method="get" action="/report-templates/{{.ReportID}}/access" hx-get="/report-templates/{{.ReportID}}/access" hx-target="#report-access-list" hx-swap="outerHTML" hx-trigger="input changed delay:300ms, search" class="mb-3"><label class="sr-only" for="access-search">Search users</label><input id="access-search" type="search" name="q" value="{{.Query}}" placeholder="Search active users" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 dark:border-slate-700 dark:bg-slate-950"></form>
  <div class="overflow-hidden rounded-lg border border-slate-200 dark:border-slate-800">{{range .Rows}}<div class="flex items-center justify-between gap-3 border-t border-slate-200 px-3 py-3 first:border-t-0 dark:border-slate-800"><div class="min-w-0"><p class="truncate font-medium">{{.Name}}</p><p class="truncate text-xs text-slate-500 dark:text-slate-400">@{{.Username}}</p></div><form method="post" action="/report-templates/{{$.ReportID}}/access/{{.ID}}" hx-post="/report-templates/{{$.ReportID}}/access/{{.ID}}?q={{$.Query}}&page={{$.Pagination.Page}}" hx-target="#report-access-list" hx-swap="outerHTML"><input type="hidden" name="grant" value="{{if .Granted}}false{{else}}true{{end}}"><button class="rounded-lg border px-3 py-1.5 text-sm font-semibold {{if .Granted}}border-red-300 text-red-700 hover:bg-red-50 dark:border-red-900 dark:text-red-300 dark:hover:bg-red-950/40{{else}}border-slate-300 hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800{{end}}">{{if .Granted}}Revoke{{else}}Grant{{end}}</button></form></div>{{else}}<p class="p-4 text-sm text-slate-500 dark:text-slate-400">No matching users.</p>{{end}}</div>
  <div class="mt-3 flex gap-2">{{if .Pagination.Previous}}<a hx-get="/report-templates/{{.ReportID}}/access?q={{.Query}}&page={{.Pagination.Previous}}" hx-target="#report-access-list" hx-swap="outerHTML" class="cursor-pointer rounded-lg border border-slate-300 px-3 py-2 text-sm hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800">Previous</a>{{end}}{{if .Pagination.Next}}<a hx-get="/report-templates/{{.ReportID}}/access?q={{.Query}}&page={{.Pagination.Next}}" hx-target="#report-access-list" hx-swap="outerHTML" class="cursor-pointer rounded-lg border border-slate-300 px-3 py-2 text-sm hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800">Next</a>{{end}}</div>
</div>{{end}}
