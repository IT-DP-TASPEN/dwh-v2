{{define "access-list"}}<div id="report-access-list">
<form method="get" action="/report-templates/{{.ReportID}}/access" hx-get="/report-templates/{{.ReportID}}/access" hx-target="#report-access-list" hx-swap="outerHTML" hx-trigger="input changed delay:300ms, search" class="mb-3"><label class="sr-only" for="access-search">Search users</label><input id="access-search" type="search" name="q" value="{{.Query}}" placeholder="Search active users" class="w-full rounded-lg border border-slate-300 bg-transparent px-3 py-2"></form>
<div class="divide-y rounded-lg border">{{range .Rows}}<div class="flex items-center justify-between px-3 py-2"><div><p class="font-medium">{{.Name}}</p><p class="text-xs text-slate-500">@{{.Username}}</p></div><form method="post" action="/report-templates/{{$.ReportID}}/access/{{.ID}}" hx-post="/report-templates/{{$.ReportID}}/access/{{.ID}}?q={{$.Query}}&page={{$.Pagination.Page}}" hx-target="#report-access-list" hx-swap="outerHTML"><input type="hidden" name="grant" value="{{if .Granted}}false{{else}}true{{end}}"><button class="rounded border px-3 py-1 text-sm">{{if .Granted}}Revoke{{else}}Grant{{end}}</button></form></div>{{else}}<p class="p-4 text-sm text-slate-500">No matching users.</p>{{end}}</div>
<div class="mt-3 flex gap-2">{{if .Pagination.Previous}}<a hx-get="/report-templates/{{.ReportID}}/access?q={{.Query}}&page={{.Pagination.Previous}}" hx-target="#report-access-list" hx-swap="outerHTML" class="cursor-pointer rounded border px-3 py-1.5 text-sm">Previous</a>{{end}}{{if .Pagination.Next}}<a hx-get="/report-templates/{{.ReportID}}/access?q={{.Query}}&page={{.Pagination.Next}}" hx-target="#report-access-list" hx-swap="outerHTML" class="cursor-pointer rounded border px-3 py-1.5 text-sm">Next</a>{{end}}</div>
</div>{{end}}
