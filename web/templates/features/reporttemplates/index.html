{{define "content"}}
<section><div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between"><div><p class="text-sm font-medium text-emerald-600 dark:text-emerald-400">Reporting</p><h1 class="page-title mt-1">Report templates</h1><p class="mt-2 text-slate-600 dark:text-slate-400">Versioned SQL, typed parameters, and per-user access.</p></div>{{if .Data.CanCreate}}<a href="/report-templates/new" class="btn btn-primary">New template</a>{{end}}</div>
  <div class="card overflow-x-auto"><table class="min-w-full divide-y divide-slate-200 text-left text-sm dark:divide-slate-800"><thead class="bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-500 dark:bg-slate-900/80 dark:text-slate-400"><tr><th class="px-4 py-3">Name</th><th class="px-4 py-3">Datasource</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Revision</th></tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-800">{{range .Data.Rows}}<tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40"><td class="px-4 py-3 font-medium"><a class="hover:text-emerald-600 dark:hover:text-emerald-400" href="/report-templates/{{.ID}}">{{.Name}}</a></td><td class="px-4 py-3 text-slate-600 dark:text-slate-300">{{.DatasourceName}}</td><td class="px-4 py-3"><span class="rounded-full px-2.5 py-1 text-xs font-medium {{if eq .Status "active"}}bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300{{else if eq .Status "disabled"}}bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300{{else}}bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300{{end}}">{{.Status}}</span></td><td class="px-4 py-3">{{.Revision}}</td></tr>{{else}}<tr><td colspan="4" class="px-4 py-12 text-center text-slate-500 dark:text-slate-400">No report templates.</td></tr>{{end}}</tbody></table></div>
</section>
{{end}}
