{{define "content"}}
<section class="space-y-6">
    <div>
        <a href="/users/{{.Data.TargetID}}" class="text-sm font-medium text-emerald-700 hover:underline dark:text-emerald-400">← User details</a>
        <h1 class="mt-4 text-3xl font-bold tracking-tight text-slate-950 dark:text-white">Reset MFA</h1>
    </div>
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8 dark:border-slate-800 dark:bg-slate-900">
        <h2 class="break-words text-xl font-semibold text-slate-950 dark:text-white">{{.Data.TargetName}}</h2>
        <p class="mt-1 break-words text-sm text-slate-600 dark:text-slate-400">@{{.Data.TargetUsername}}</p>
        <div class="mt-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-900 dark:bg-red-950/60 dark:text-red-300">
            <p class="font-semibold">This will:</p>
            <ul class="mt-2 list-disc space-y-1 pl-5">
                <li>Remove the current authenticator</li>
                <li>Invalidate recovery codes</li>
                <li>Revoke all sessions</li>
                <li>Require MFA enrollment on next login</li>
            </ul>
        </div>
        <form method="post" action="/mfa/users/{{.Data.TargetID}}/reset" class="mt-6 flex flex-wrap gap-3">
            <button name="confirm" value="reset" class="rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-slate-900">Reset MFA and require re-enrollment</button>
            <a href="/users/{{.Data.TargetID}}" class="rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800">Cancel</a>
        </form>
    </div>
</section>
{{end}}
